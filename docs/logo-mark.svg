    <linearGradient id="bg" x1="52" y1="38" x2="460" y2="474" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0b1730"/><stop offset="1" stop-color="#080d1d"/></linearGradient>
    <linearGradient id="spectrum" x1="78" y1="112" x2="426" y2="390" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#64dcff"/><stop offset=".35" stop-color="#7b9bff"/><stop offset=".62" stop-color="#d477ed"/><stop offset=".84" stop-color="#ff8e8b"/><stop offset="1" stop-color="#ffd45c"/></linearGradient>
