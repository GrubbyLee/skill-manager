<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">skill-manager logo mark</title>
  <desc id="desc">A shield-shaped command mark with a crown, connected skill nodes, and SKM monogram.</desc>
  <defs>
    <linearGradient id="mark-bg" x1="76" y1="64" x2="436" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset=".52" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mark-ring" x1="76" y1="88" x2="436" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".48" stop-color="#86efac"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="mark-crown" x1="154" y1="112" x2="358" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset=".42" stop-color="#86efac"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.49 0 0 0 0 0.83 0 0 0 0 0.99 0 0 0 .45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#020617"/>
  <path d="M256 48 410 118v130c0 101-59 177-154 216C161 425 102 349 102 248V118L256 48Z" fill="url(#mark-bg)" stroke="url(#mark-ring)" stroke-width="12"/>
  <path d="M128 138 256 80l128 58v105c0 84-47 147-128 183-81-36-128-99-128-183V138Z" fill="none" stroke="#263247" stroke-width="2"/>

  <g filter="url(#glow)">
    <path d="M158 178 201 123l55 70 55-70 43 55v52H158v-52Z" fill="url(#mark-crown)"/>
    <path d="M170 238h172" stroke="#e5e7eb" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 312h176M168 312l52-52h72l52 52M220 260v104M292 260v104" stroke="#7dd3fc" stroke-width="10"/>
    <path d="M220 364h72" stroke="#86efac" stroke-width="10"/>
    <path d="M176 312c0-44 36-80 80-80s80 36 80 80" stroke="#c084fc" stroke-width="5" opacity=".62"/>
  </g>

  <g fill="#020617" stroke="#e5e7eb" stroke-width="8">
    <circle cx="168" cy="312" r="18"/>
    <circle cx="220" cy="260" r="18"/>
    <circle cx="292" cy="260" r="18"/>
    <circle cx="344" cy="312" r="18"/>
    <circle cx="220" cy="364" r="18"/>
    <circle cx="292" cy="364" r="18"/>
  </g>

  <text x="256" y="340" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="900" letter-spacing="-4">SKM</text>
</svg>
