<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">skill-manager logo</title>
  <desc id="desc">skill-manager wordmark with a shield crown skill graph logo mark.</desc>
  <defs>
    <linearGradient id="word" x1="312" y1="92" x2="1068" y2="214" gradientUnits="userSpaceOnUse">
